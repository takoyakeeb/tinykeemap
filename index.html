<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tinykeemap</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上の1行: 接続の点、未保存の変更の数、読み直す、保存する、「…」メニュー -->
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">tinykeemap</h1>
      <div class="conn">
        <span id="status-dot" class="dot dot-off" aria-hidden="true"></span>
        <span id="status" class="status status-off">未接続</span>
      </div>
      <div class="spacer"></div>
      <span id="dirty-badge" class="dirty-badge" role="status"></span>
      <button id="btn-connect" class="btn-primary" type="button">接続する</button>
      <button id="btn-load" class="btn-text" type="button" disabled title="キーボードに保存した内容を読み直します。未保存の変更は破棄されます">読み直す</button>
      <button id="btn-save" class="btn-primary" type="button" disabled title="今のキーマップをキーボードの Flash に保存します">保存する</button>
      <button id="btn-menu" class="btn-icon" type="button" aria-label="その他" aria-haspopup="menu" aria-expanded="false">···</button>

      <div id="menu" class="popup menu" role="menu" hidden>
        <button id="menu-reset" type="button" role="menuitem" disabled>初期のキーマップに戻す…</button>
        <button id="menu-layout" type="button" role="menuitem" disabled title="KLE(keyboard-layout-editor.com)の JSON ファイルを選んで、キーの並びを変えます">配列を読み込む…</button>
        <button id="menu-layout-clear" type="button" role="menuitem" hidden>読み込んだ配列を消す</button>
        <button id="menu-detail" type="button" role="menuitem" aria-expanded="false">デバイス情報・通信ログ</button>
        <button id="menu-reload" type="button" role="menuitem" disabled title="キーボードから、いまの内容を読み込み直します(保存済みの内容を読む「読み直す」とは別です)">再読み込み</button>
        <button id="menu-disconnect" type="button" role="menuitem" disabled>切断する</button>
      </div>

      <div id="reset-confirm" class="popup confirm" role="alertdialog" aria-labelledby="reset-confirm-title" hidden>
        <div id="reset-confirm-title" class="confirm-title">初期のキーマップに戻しますか</div>
        <p id="reset-confirm-text" class="confirm-text"></p>
        <div class="confirm-actions">
          <button id="reset-cancel" class="btn-text" type="button">やめる</button>
          <button id="reset-ok" class="btn-primary" type="button">戻す</button>
        </div>
      </div>
    </div>
  </header>

  <input id="layout-file" type="file" accept=".json,application/json" hidden>

  <main>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="save-msg" class="edit-msg" role="status" hidden></div>

    <section class="panel" id="keymap-panel" aria-labelledby="keymap-title" hidden>
      <h2 id="keymap-title" class="sr-only">キーマップ</h2>
      <!-- レイヤーのタブ(絵の真上)。app.js が作る -->
      <div id="layer-tabs" class="tabs" role="group" aria-label="レイヤー"><span class="tabs-label">レイヤー</span></div>
      <div id="keymap"></div>
    </section>

    <!-- 下のパネル(画面の下にくっつける)。中身は、段階4で作り直す -->
    <section class="panel edit-dock" id="edit-panel" aria-labelledby="edit-title" hidden>
      <div class="edit-grid">
        <div class="edit-card">
          <h2 id="edit-title" class="card-title">キーを選んでください</h2>
          <div id="card-body" class="card-body" hidden>
            <button id="btn-deselect" class="card-close" type="button" aria-label="選択をやめる">×</button>
            <div id="card-cap" class="card-cap" aria-hidden="true"></div>
            <p id="card-name" class="card-name"></p>
          </div>
        </div>
        <div class="edit-pick">
          <label for="kc-search">名前で絞り込み</label>
          <input id="kc-search" type="search" placeholder="例: A, Enter, F5, KC_ESC" autocomplete="off" disabled>
          <select id="kc-list" size="6" aria-label="keycode の一覧" disabled></select>
        </div>
        <div class="edit-value">
          <label for="kc-hex">keycode(16進、または名前。例: 0x0004、KC_A、MO(1)、LSFT(KC_A))</label>
          <input id="kc-hex" type="text" placeholder="0x0004" autocomplete="off" spellcheck="false" disabled>
          <div id="kc-preview" class="kc-preview" aria-live="polite"></div>
          <button id="btn-set" type="button" disabled>変更する</button>
          <p class="hint save-note">すぐ反映されます。「保存する」までは、USBを抜くと元に戻ります。</p>
        </div>
      </div>
      <div id="edit-msg" class="edit-msg" role="status" hidden></div>
    </section>

    <!-- 「…」メニューの「デバイス情報・通信ログ」で開く -->
    <section class="panel" id="detail" aria-label="デバイス情報・通信ログ" hidden>
      <h2 id="info-title">デバイス情報</h2>
      <dl id="info" class="info"></dl>
      <h2 id="log-title" class="detail-sub">通信ログ</h2>
      <pre id="log" class="log" aria-live="off"></pre>
    </section>
  </main>

  <footer class="foot">MIT License</footer>

  <script src="keycodes.js"></script>
  <script src="devices.js"></script>
  <script src="app.js"></script>
</body>
</html>
